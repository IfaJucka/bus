<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Smart College Bus Tracking</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8E7;
      color: #263746;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #D9ECFA;
      border-radius: 16px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 14px rgba(38, 55, 70, 0.08);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
      color: #263746;
    }
    p {
      color: #657786;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background-color: #A9D6F5;
      color: #263746;
      border: 1px solid #6FA8D6;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background-color: #6FA8D6;
      color: #FFFFFF;
    }
    .notice {
      font-size: 12px;
      color: #657786;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Currently Offline</h1>
    <p>Smart Bus requires an active internet connection to receive live GPS telemetry and real-time arrival estimates.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Retry</button>
    <div class="notice">Cached schedules and routes will reload once connected.</div>
  </div>
</body>
</html>
